[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waghost"
version = "1.0.0"
description = "Request and verify WhatsApp registration OTPs over raw HTTP — no app, no QR code, no browser."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["whatsapp", "otp", "sms", "verification", "registration", "automation", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: System :: Networking",
]
dependencies = ["requests>=2.31.0,<3.0.0"]

[project.optional-dependencies]
pretty = ["rich>=13.0.0"]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.6.0", "build>=1.2.0"]

[project.urls]
Homepage = "https://github.com/USER/waghost"
Issues = "https://github.com/USER/waghost/issues"
Source = "https://github.com/USER/waghost"

[project.scripts]
waghost = "waghost.cli:main"
wotp = "waghost.cli:main"

[tool.setuptools.packages.find]
include = ["waghost*"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]